<VirtualHost *:8080>
    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    <Directory /var/www/html/storage/app/public>
        AllowOverride None
        Options -Indexes -ExecCGI
        <FilesMatch "(?i)\.(php[0-9]?|phtml|phar)$">
            Require all denied
        </FilesMatch>
    </Directory>
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
    ErrorLog /proc/self/fd/2
    LogFormat "%h %l %u %t \"%m %U %H\" %>s %b" without_query
    CustomLog /proc/self/fd/1 without_query
</VirtualHost>
